spring:
  application:
    name: prueba-tecnica-gestion-polizas
  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always

server:
  port: 8080

# Seguridad mínima: valor de la api-key exigida en el header "api-key".
app:
  api-key: "123456"

logging:
  level:
    com.bolivar.polizas: INFO
