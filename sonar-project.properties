sonar.projectKey=prueba-tecnica-gestion-polizas
sonar.projectName=Prueba Técnica - Gestión de Pólizas
sonar.sourceEncoding=UTF-8

# Fuentes y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Cobertura (reporte generado por JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusiones de cobertura: la clase de arranque de Spring Boot solo contiene main().
sonar.coverage.exclusions=**/PolizasApplication.java
